# tested with Open On-Chip Debugger 0.10.0 on Ubuntu 20.04
# Updated for OpenOCD 0.12+: interface/stlink-v2.cfg is now a deprecation shim
# for interface/stlink.cfg, which uses the DAP "dapdirect" driver. The old
# "hla_swd" transport no longer applies and selecting it after the driver has
# auto-selected dapdirect_swd fails with
#   "Can't change session's transport after the initial selection was made".

source [find interface/stlink.cfg]
transport select swd
source [find target/stm32f1x.cfg]
